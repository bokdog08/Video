name: Build PrivateReel APK
on:
  push:
    branches: [private-reel-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore PrivateReel project
        run: |
          python3 -m pip install --quiet --break-system-packages brotli
          mkdir -p workspace
          python3 - <<'PY'
          import brotli,io,tarfile
          with open('PrivateReel.tar.br','rb') as f: raw=brotli.decompress(f.read())
          with tarfile.open(fileobj=io.BytesIO(raw)) as tar:
              tar.extractall('workspace',filter='data')
          PY
      - name: Build Android debug APK
        working-directory: workspace
        run: |
          curl -fL --retry 3 -sS https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateReel-debug-APK
          path: workspace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
